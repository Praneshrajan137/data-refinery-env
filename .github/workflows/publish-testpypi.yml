name: Publish dataforge to TestPyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refuse local/dev versions
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          forbidden = (".dev", "+")
          if any(marker in version for marker in forbidden):
              raise SystemExit(f"TestPyPI rehearsal requires release-like metadata, found {version!r}.")
          PY

      - name: Canonical release gate
        run: python -m dataforge.release.gate --json

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from TestPyPI outside source checkout
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              dataforge==0.1.0 && break
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Smoke installed TestPyPI artifact
        run: python scripts/ci/installed_cli_smoke.py --output testpypi-installed-cli-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: dataforge-testpypi-installed-cli-smoke
          path: testpypi-installed-cli-smoke.json
