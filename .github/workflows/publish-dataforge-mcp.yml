name: Publish dataforge-mcp

on:
  push:
    tags:
      - "dataforge-mcp-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build core dependency wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Build package
        working-directory: dataforge-mcp
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke built package
        run: |
          python -m venv .mcp-publish-smoke
          .mcp-publish-smoke/bin/python -m pip install --find-links dist --find-links dataforge-mcp/dist dataforge-mcp
          .mcp-publish-smoke/bin/python - <<'PY'
          import shutil
          import sys
          from pathlib import Path

          command = Path(sys.executable).with_name("dataforge-mcp")
          assert command.exists(), command
          assert shutil.which(str(command)) or command.exists()
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dataforge-mcp/dist
