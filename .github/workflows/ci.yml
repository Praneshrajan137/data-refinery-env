name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, to run the uncached type check below. Mypy's docs warn that incremental cache data can
  # drift over a long period; a scheduled full rebuild is the only thing that catches that.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `setup-python`'s `cache: pip` caches DOWNLOADS, not the environment, so the install below
      # is paid in full every run. This cache is different: it holds mypy's incremental state, which
      # is the expensive part of `make type` on 178 files from cold.
      #
      # The key deliberately includes the Python version, the mypy version and the config hash.
      # Mypy's cache is version-bound -- its own docs note the daemon restarts when the config or
      # mypy version changes -- and inferred types differ per Python version, so a key missing any
      # of those can serve a stale cache that produces wrong results rather than slow ones.
      #
      # mypy's docs also warn that "repeatedly updating cache data incrementally could result in
      # drift over a long time period". The `nightly-full-type-check` job below exists to counter
      # that: it runs uncached on a schedule, so a drifted cache cannot hide indefinitely.
      - name: Cache mypy incremental state
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/**') }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r playground/api/requirements.txt
      - name: Lint
        run: make lint
      - name: Type-check
        run: make type
      - name: Test
        run: make test
      - name: README truth
        run: python scripts/ci/readme_truth.py

  # Runs uncached and non-incrementally, on a schedule, because mypy's own documentation warns that
  # incremental cache data can drift over a long period and recommends periodic full rebuilds. A
  # cached type check that has quietly gone wrong looks exactly like a fast one.
  nightly-full-type-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Type-check with no cache
        run: python -m mypy --strict --no-incremental --cache-dir=/dev/null dataforge

  # The FAST TRIPWIRE. Deliberately has no `needs:`, so it starts immediately and reports in about a
  # minute -- the first signal on a push, not the last.
  #
  # It used to declare `needs: quality`, which meant a ~1 minute check waited ~5 minutes for a job
  # whose work it partly duplicated. That is also why it is kept rather than deleted as a duplicate
  # of `make test`: it is the only job that reports quickly, and a suite subset that reports first
  # earns its slot even though a later job covers the same tests.
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Existing regression suite MUST NOT break
        run: pytest tests/regression/ -x

  # No `needs: quality`. This job took 7m48s and waited ~5 minutes for `quality` first, making the
  # critical path the SUM of the two rather than the MAX. It is safe to start immediately because it
  # is self-contained: steps 4 to 9 of the gate run ruff and strict mypy over the same paths
  # `make lint` and `make type` cover, so nothing it depends on is established only by `quality`.
  #
  # The cost of removing the dependency is runner minutes when lint fails. The benefit is that the
  # longest job starts at t=0. For a gate whose purpose is to report, reporting sooner wins.
  canonical-backend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache mypy incremental state
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-gate-${{ hashFiles('pyproject.toml', 'requirements/**') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-gate-
      - name: Install frontend deps
        run: npm --prefix playground/web ci
      - name: Install browser deps
        run: cd playground/web && npx playwright install --with-deps chromium
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./dataforge-mcp[dev]"
          pip install -r docs/requirements.txt
          pip install -r playground/api/requirements.txt
      - name: Canonical backend gate
        run: python scripts/ci/backend_gate.py --require-optional

  test-map-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Validate test_map.json schema and mapped paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mapping = json.loads(Path("test_map.json").read_text(encoding="utf-8"))
          errors = []

          for source_file, entry in mapping.items():
              if source_file.startswith("_"):
                  continue
              if not isinstance(entry, dict):
                  errors.append(f"{source_file}: expected object, got {type(entry).__name__}")
                  continue
              for key, value in entry.items():
                  if not isinstance(value, list):
                      errors.append(
                          f"{source_file}.{key}: expected list[str], got {type(value).__name__}"
                      )
                      continue
                  for test_path in value:
                      if not isinstance(test_path, str):
                          errors.append(
                              f"{source_file}.{key}: expected list[str], found {type(test_path).__name__}"
                          )
                      elif not Path(test_path).exists():
                          errors.append(f"{source_file}.{key}: missing path {test_path}")

          if errors:
              raise SystemExit("\n".join(errors))

          mapped_files = [name for name in mapping if not name.startswith("_")]
          print(f"Validated test_map.json for {len(mapped_files)} mapped source file(s).")
          PY

      # The schema check above proves every mapped path exists. This proves the converse: that
      # every module has a mapping DECISION, so the gap between the fast path and the full suite
      # cannot widen unnoticed. Both directions are needed -- valid entries say nothing about
      # missing ones.
      - name: Every dataforge module has a mapping decision
        run: python scripts/ci/test_map_coverage.py --check

  playground-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frontend deps
        run: npm --prefix playground/web ci
      - name: Install browser deps
        run: cd playground/web && npx playwright install --with-deps chromium
      - name: Frontend gate
        run: npm --prefix playground/web run test
      # The accessibility sweep and the density frame budget are separate steps rather than
      # folded into `run test`, so a failure names which guarantee broke. Both existed as
      # npm scripts but were invoked by NO workflow: 35 axe scans (every route x light and
      # dark x prefers-contrast, plus forced-colors) and the 16ms frame budget were
      # local-only and could not fail a pull request.
      - name: Frontend accessibility sweep
        run: npm --prefix playground/web run test:a11y
      - name: Frontend density frame budget
        run: npm --prefix playground/web run perf:density
      - name: Install core + dev + playground deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r playground/api/requirements.txt
      - name: Playground smoke tests
        run: pytest tests/integration/test_playground_smoke.py tests/unit/test_playground_deploy_contract.py tests/unit/test_playground_stage_space.py tests/unit/test_playground_web_contract.py -x -v
      - name: Validate HF Space YAML front-matter
        run: |
          python -c "
          import yaml, pathlib, sys
          meta = pathlib.Path('playground/api/README.md').read_text()
          front = meta.split('---')[1]
          data = yaml.safe_load(front)
          required = {'title','sdk','app_port','license'}
          missing = required - set(data.keys())
          if missing:
              sys.exit(f'Missing HF metadata keys: {missing}')
          assert data['sdk'] == 'docker', f'sdk must be docker, got {data[\"sdk\"]}'
          assert data['app_port'] == 7860, f'app_port must be 7860, got {data[\"app_port\"]}'
          print('HF Space YAML front-matter valid.')
          "
      - name: No browser storage APIs in frontend
        run: "! grep -rE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=test-results --exclude-dir=playwright-report 'localStorage|sessionStorage' playground/web/"
      - name: No API keys in frontend
        run: "! grep -rE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=test-results --exclude-dir=playwright-report 'GROQ_API_KEY|GEMINI_API_KEY|\\bsk-[A-Za-z0-9]{32,}\\b' playground/web/"
