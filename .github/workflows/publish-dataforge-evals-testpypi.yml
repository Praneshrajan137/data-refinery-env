name: Publish dataforge_07_evals to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/dataforge-evals --sdist --wheel --outdir packages/dataforge-evals/dist

      - name: Smoke built package
        run: |
          python -m pip install --find-links packages/dataforge-evals/dist dataforge_07_evals
          python scripts/ci/installed_package_smoke.py \
            --package dataforge_07_evals \
            --output dataforge_07_evals-built-smoke.json

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/dataforge-evals/dist
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fresh install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            dataforge_07_evals
          python scripts/ci/installed_package_smoke.py \
            --package dataforge_07_evals \
            --output dataforge_07_evals-testpypi-smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: dataforge-07-evals-testpypi-smoke
          path: dataforge_07_evals-testpypi-smoke.json
