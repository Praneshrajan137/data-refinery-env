name: Publish dataforge-mcp to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build core and MCP wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m build dataforge-mcp --sdist --wheel --outdir dataforge-mcp/dist

      - name: Smoke built MCP package
        run: |
          python -m venv .mcp-testpypi-smoke
          .mcp-testpypi-smoke/bin/python -m pip install --find-links dist --find-links dataforge-mcp/dist dataforge-mcp
          .mcp-testpypi-smoke/bin/python - <<'PY'
          import sys
          from pathlib import Path

          assert Path(sys.executable).with_name("dataforge-mcp").exists()
          PY

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dataforge-mcp/dist
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fresh install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            dataforge dataforge-mcp
          dataforge --version
          dataforge-mcp --help
