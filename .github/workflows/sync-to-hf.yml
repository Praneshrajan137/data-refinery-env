name: Deploy Hugging Face Space

on:
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_SPACE_ID: Praneshrajan15/dataforge-playground
      DATAFORGE_PLAYGROUND_ORIGINS: https://dataforge.praneshrajan15.workers.dev
      DATAFORGE_REMOTE_MODEL_URL: https://Praneshrajan15-dataforge-model.hf.space
      DATAFORGE_PLAYGROUND_AGENT_MAX_STEPS: "2"
      DATAFORGE_PLAYGROUND_AGENT_TIMEOUT_SECONDS: "240"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Configure production CORS origin
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_ID"]
          api.add_space_variable(
              space,
              "DATAFORGE_PLAYGROUND_ORIGINS",
              os.environ["DATAFORGE_PLAYGROUND_ORIGINS"],
          )
          # Keep agent mode (trained-model remote policy) live across redeploys.
          for variable in (
              "DATAFORGE_REMOTE_MODEL_URL",
              "DATAFORGE_PLAYGROUND_AGENT_MAX_STEPS",
              "DATAFORGE_PLAYGROUND_AGENT_TIMEOUT_SECONDS",
          ):
              value = os.environ.get(variable, "").strip()
              if value:
                  api.add_space_variable(space, variable, value)
          PY

      - name: Stage Hugging Face Space contents
        run: python scripts/playground/stage_space.py --output-dir .hf-space-stage

      - name: Clone target Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://Praneshrajan15:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} .hf-space-repo

      - name: Mirror staged tree into Space repo
        run: rsync -a --delete --exclude '.git/' .hf-space-stage/ .hf-space-repo/

      - name: Commit and push if changed
        working-directory: .hf-space-repo
        run: |
          if [[ -z "$(git status --short)" ]]; then
            echo "No Space changes to deploy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: sync staged DataForge Space"
          git push origin HEAD:main
