[project]
name = "dataforge_07"
version = "0.1.0"
description = "DataForge: CLI-first data-quality detection and reversible repair for tabular data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
keywords = ["data-quality", "ai-agent", "llm", "rl", "smt", "dbt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.24,<0.25",
    # click is typer's engine (transitive). Pin a security floor so the resolver
    # cannot backtrack to click 8.2.1 (PYSEC-2026-2132) during multi-step CI installs.
    "click>=8.3.3",
    "rich>=13.7",
    "textual>=8.2,<9",
    "z3-solver>=4.13",
    "pyyaml>=6.0",
    # numpy is pandas' engine (transitive) and is imported directly by
    # dataforge/causal/pc.py. Cap it below 2.5 because numpy 2.5.0 raised its floor to
    # Python >=3.12, while this project supports >=3.11: without the cap the resolver is
    # free to install a numpy that contradicts our own requires-python. It broke CI on
    # 2026-08-13 as a type error rather than an install error, because numpy 2.5 stubs use
    # PEP 695 `type` statements that mypy cannot parse under python_version = 3.11.
    "numpy>=1.26,<2.5",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Praneshrajan137/dataforge"
Repository = "https://github.com/Praneshrajan137/dataforge"
Documentation = "https://dataforge.praneshrajan15.workers.dev/playground"

[project.optional-dependencies]
bench = [
    "pandas>=2.2",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",
]
causal = [
    "pandas>=2.2",
    "numpy>=1.26,<2.5",
    "networkx>=3.3",
    "causal-learn>=0.1.4",
    "hyppo>=0.5.2",
    "scipy>=1.13",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    # pytest-xdist >= 3.6.1 is a CORRECTNESS floor, not a preference. 3.6.0 (#1024) added
    # "proper handling of shouldstop (such as set by --max-fail) and shouldfail conditions in
    # workers. Previously, a worker might have continued executing further tests before the
    # controller could terminate the session." `make test` uses -x, so on an earlier version the
    # early exit reports a different set of failures than a serial run does. 3.8 is the current
    # release; the floor is set there so the behaviour cannot regress under a resolver backtrack.
    "pytest-xdist>=3.8",
    "hypothesis>=6.100",
    # Validates the published attestation JSON Schema against real attestations and against
    # every conformance vector. Declared rather than relied on transitively so the check is
    # unconditional: a schema conformance test guarded by importorskip reads as passing on any
    # machine that happens not to have the validator, which is the "skipped is not passed"
    # failure this project's verifier reports separately for exactly this reason.
    "jsonschema>=4.20",
    # `-n logical` needs psutil on Python < 3.13, and FALLS BACK SILENTLY without it -- the run
    # succeeds using physical cores while the command says logical. This suite is dominated by
    # subprocess launches and file I/O rather than CPU, so logical cores are the right unit and
    # the difference is real. Declared explicitly because the failure mode is silent.
    "psutil>=5.9",
    "mutmut>=3.5",
    "build>=1.2",
    "pip-audit>=2.10,<3",
    "cyclonedx-bom>=7.3,<8",
    # Security floors, not just "whatever the lock happens to hold". Same reasoning as the click
    # pin above: the lockfile is consumed in exactly one place (Dockerfile.env), so a floor is what
    # stops a resolver anywhere else backtracking onto the vulnerable build.
    # cryptography < 50.0.0 carries CVE-2026-69247, a Bleichenbacher oracle in PKCS#7
    # EnvelopedData decryption. Not reachable here (zero `pkcs7` hits in the repo; it arrives via
    # Authlib in the openenv extra), but the fix is a floor bump, so there is nothing to weigh.
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pip>=26.1.2",
    "urllib3>=2.7",
    # aiohttp <= 3.14.2 carries CVE-2026-69244 (out-of-bounds heap read in the C HTTP response
    # parser), and <= 3.14.1 adds CVE-2026-69243 (request smuggling via WebSocket upgrade) and
    # CVE-2026-59881 (WebSocket client accepting compressed frames without negotiated
    # permessage-deflate). 3.14.3 is the first release clear of all three.
    "aiohttp>=3.14.3",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    # Lint/type tooling is pinned to a narrow range on purpose. Unbounded ranges made CI a
    # moving target: ruff 0.16 began formatting Python code blocks inside Markdown, which
    # broke the side-package format check with no code change, and CI resolved mypy 2.3 while
    # a developer machine sat on 1.20. A gate that depends on which day it ran is not a gate.
    "ruff>=0.16.2,<0.17",
    "mypy>=2.3,<3",
    "pandas-stubs>=2.2",
    "types-PyYAML",
    "huggingface_hub==1.13.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",
    "networkx>=3.3",
    "causal-learn>=0.1.4",
    "hyppo>=0.5.2",
    "scipy>=1.13",
    "sqlglot>=25.0",
    "duckdb>=1.0",
]
train = [
    "trl==1.4.0",
    "transformers==5.7.0",
    "accelerate==1.13.0",
    "peft==0.19.1",
    "bitsandbytes==0.49.2",
    # 5.0.1 is a SECURITY floor, and it replaces a pip-audit exception rather than adding one.
    # datasets <= 5.0.0 carries PYSEC-2026-3716 (= CVE-2026-66007, CWE-22): folder-based dataset
    # builders join an unvalidated `file_name` metadata field to the dataset directory, so a
    # hostile dataset directory can read arbitrary local files, which are then embedded into
    # output on save_to_disk or push_to_hub. Fixed in 5.0.1; there is no patched 4.x backport, so
    # the only options were a permanent suppression or this bump.
    #
    # The former exception argued a 5.x move meant "a deliberate training-stack revalidation"
    # because of the sibling pins. That was wrong, checked against PyPI metadata: trl 1.4.0
    # requires `datasets>=4.7.0` with no upper bound, and transformers 5.7.0 does not require
    # datasets in its core dependencies at all (only in the quality/retrieval/testing/dev
    # extras, at `>=2.15.0`). Measured on 2026-08-30 in a throwaway venv on Python 3.12.10: the
    # full train extra resolves with every other pin held exactly (huggingface_hub 1.13.0,
    # pandas 2.3.3), `pip check` is clean, and pip-audit reports no known vulnerabilities.
    "datasets==5.0.1",
    "huggingface_hub==1.13.0",
    "pyyaml==6.0.3",
    "pandas==2.3.3",
    "tensorboard==2.20.0",
]
eval = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
providers = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]
pandas = [
    "pandas>=2.2",
]
# Deliberately NOT a member of `all`, and that omission is the point. `kaggle` is an operational
# credential tool used by exactly one consumer -- scripts/preflight/check_kaggle_auth.py, which
# dataforge/release/doctor.py invokes for the Kaggle OAuth clean-config check. It is imported
# lazily inside a function and guarded by ImportError, so nothing breaks without it. Putting it in
# `all` would install it for every developer and permanently widen the pip-audit surface (kaggle
# pulls `bleach`) for a tool most sessions never run.
#
# `kagglesdk` is intentionally not listed: kaggle 2.2.4 already requires kagglesdk<1.0,>=0.1.35,
# so naming it here would duplicate a constraint upstream owns.
#
# Not declarable, and not attempted: `kaggle_secrets`, imported at 11 sites across
# scripts/remote/ and training/kaggle_*_kernel/. It is not on PyPI at all -- it exists only inside
# the Kaggle notebook runtime, which is why every one of those imports sits in a try/except that
# degrades to an explicit "unavailable" result.
kaggle = [
    "kaggle>=2",
]
playground = [
    "pandas>=2.2",
    "fastapi>=0.136.1",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.31",
    "slowapi>=0.1.9",
]
openenv = [
    "pandas>=2.2",
    "openenv-core[core]>=0.2.2",
    "authlib>=1.7.1,!=1.7.0",
    # Kept in step with the dev floor above: CVE-2026-69247. Authlib is the reason cryptography is
    # named here at all, and it is also the dependent most likely to notice a major bump -- a fresh
    # resolve on 2026-08-28 installed cryptography 50.0.1 alongside Authlib with pip-audit clean,
    # so this floor is confirmed rather than hoped for.
    "cryptography>=50.0.0",
    "duckdb>=1.0",
    "sqlglot>=25.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "causal-learn>=0.1.4",
    "hyppo>=0.5.2",
]
all = [
    "dataforge_07[bench,causal,dev,eval,pandas,playground,providers,train,openenv]",
]

[project.scripts]
dataforge = "dataforge.cli:app"
dataforge15 = "dataforge.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataforge", "dataforge.*"]
# No `exclude` needed. Until 2026-08-27 this excluded ["data_quality_env", "data_quality_env.*"],
# the frozen OpenEnv RL hackathon package that has since been deleted. `include` is already
# an allowlist, so naming a deleted package here would police an empty population -- it
# would keep passing while proving strictly less. The guard that replaces it lives in
# tests/regression/test_env.py, which asserts the name is NOT importable at all.

[tool.setuptools.package-data]
dataforge = [
    "py.typed",
    "fixtures/*.csv",
    "fixtures/*.yaml",
    "datasets/embedded/**/*.csv",
    "safety/constitutions/*.yaml",
    "safety/adversarial/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".hf-space-repo", ".hf-space-stage", ".hf-space-stage-plan"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"archive/training/kaggle/sft_warmup_kaggle.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
exclude = [
    "^\\.hf-space-repo/",
    "^\\.hf-space-stage/",
    "^\\.hf-space-stage-plan/",
    "^(archive|playground)/",
]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true

# `mcp` ships in the separate `dataforge-mcp` distribution and is deliberately NOT a
# dependency of the core package, so `pip install -e ".[dev]"` does not provide it. The one
# consumer (`scripts/ci/installed_package_smoke.py`) imports it lazily inside a function and
# is skipped when absent. Without this, CI type-check fails while a developer machine that
# happens to have `mcp` installed passes -- which is exactly how this drifted undetected.
# `ignore_missing_imports` only suppresses the "cannot find stubs" error; when `mcp` IS
# installed, mypy still type-checks against the real package.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

# `kaggle` and `kagglesdk` ship no `py.typed`, so `mypy --strict` reports import-untyped for
# scripts/preflight/check_kaggle_auth.py's two imports. Same shape as the `mcp` case above: the
# imports are lazy, inside a function, guarded by ImportError, and the package is an opt-in extra
# (`.[kaggle]`) that neither CI nor a default install provides. Without this, adding that file to
# the type target would fail CI while passing on a machine that happens to have kaggle installed.
# `ignore_missing_imports` only suppresses the missing-stubs error; the surrounding code is still
# fully type-checked.
#
# Submodule patterns only, no bare `kaggle`/`kagglesdk`: the real imports are
# `kaggle.api.kaggle_api_extended` and `kagglesdk.kaggle_creds`, and mypy reports bare entries as
# `unused section(s)`. A pattern that matches nothing is noise that trains readers to skim
# type-check output, so it is left out until something actually imports the top-level module.
[[tool.mypy.overrides]]
module = ["kaggle.*", "kagglesdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# `--dist loadgroup` is present unconditionally and is inert without `-n`, verified on
# 2026-08-28. It must be here rather than only in the Makefile: without it, an
# `@pytest.mark.xdist_group` mark is SILENTLY IGNORED, so a developer running `pytest -n auto`
# by hand would get a green-looking run with no grouping at all. A guard that only works when
# invoked through one entry point is not a guard.
#
# No `-m` filter is set, so `integration` tests are not deselected by default. That is
# deliberate -- they use an in-process ASGI TestClient and bind no socket.
addopts = "-ra --strict-markers --strict-config --dist loadgroup"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "requires_network: tests that need internet access",
    "requires_llm: tests that call a free-tier LLM API",
]

[tool.coverage.run]
source = ["dataforge"]
branch = true

[tool.coverage.report]
fail_under = 82
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
