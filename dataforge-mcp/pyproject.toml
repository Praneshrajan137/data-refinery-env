[project]
name = "dataforge_07_mcp"
version = "0.1.0"
description = "Model Context Protocol server for DataForge data-quality tools."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dataforge_07>=0.1.0,<0.2",
    # Capped at <2 deliberately. mcp 2.0.0 is a breaking release: CallToolResult.isError
    # was renamed to is_error and mcp.server.fastmcp moved, so this package's code and
    # scripts/ci/installed_package_smoke.py do not run against it. This was the only
    # uncapped dependency in the file, and CI duly resolved to 2.0.0 and broke. Raising the
    # cap is a deliberate migration, not a version bump.
    "mcp>=1.27,<2",
    "PyJWT>=2.13.0,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["data-quality", "dataforge", "mcp", "model-context-protocol"]

[project.urls]
Homepage = "https://github.com/Praneshrajan137/dataforge"
Repository = "https://github.com/Praneshrajan137/dataforge"
Documentation = "https://dataforge.praneshrajan15.workers.dev/playground"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
dataforge-mcp = "dataforge_mcp.server:main"
dataforge15-mcp = "dataforge_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataforge_mcp*"]
