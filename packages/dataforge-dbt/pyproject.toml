[project]
name = "dataforge_07_dbt"
version = "0.1.0"
description = "dbt relation-export wrapper for DataForge data-quality repair audits."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
keywords = ["dataforge", "dbt", "data-quality", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dataforge_07>=0.1.0,<0.2",
    "dbt-duckdb>=1.8,<1.11",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Aegis15/dataforge"
Repository = "https://github.com/Aegis15/dataforge"
Documentation = "https://dataforge.praneshrajan15.workers.dev/playground"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.11",
    "mypy>=1.10,<1.20",
    "types-PyYAML",
]

[project.scripts]
dataforge-dbt = "dataforge_dbt.dispatch:main"
dataforge15-dbt = "dataforge_dbt.dispatch:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataforge_dbt*"]

[tool.setuptools.package-data]
dataforge_dbt = ["macros/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["dataforge.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["duckdb", "yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["integration_tests"]
markers = [
    "integration: marks tests as integration tests",
]
