[project]
name = "dataforge_07_evals"
version = "0.1.0"
description = "Agent-agnostic evaluation harness for data-quality repair agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
keywords = ["data-quality", "evaluation", "agents", "benchmarks", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Aegis15/dataforge"
Repository = "https://github.com/Aegis15/dataforge"
Documentation = "https://dataforge.praneshrajan15.workers.dev/playground"

[project.optional-dependencies]
dataforge = ["dataforge_07>=0.1.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]
all = ["dataforge_07_evals[dataforge,dev]"]
hf = [
    "transformers>=4.44",
    "torch>=2.12",
    "accelerate>=0.33",
]

[project.scripts]
dataforge-evals = "dataforge_evals.cli:app"
dataforge15-evals = "dataforge_evals.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataforge_evals*"]

[tool.setuptools.package-data]
dataforge_evals = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_network: tests that need internet access",
    "requires_llm: tests that call a provider API",
]

[tool.coverage.run]
source = ["dataforge_evals"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
