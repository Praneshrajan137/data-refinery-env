claims:
  - claim: csv_verified_repair
    status: beta
    evidence: Local CSV lifecycle tests exercise detect, propose, safety, SMT verify, dry-run/apply, audit, and byte-identical revert.
  - claim: duckdb_verified_patch_plan
    status: beta
    evidence: DuckDB table-store tests cover patch-plan hashing, preflight row-count guards, transaction journaling, and rollback SQL.
  - claim: dbt_aware_receipts
    status: experimental
    evidence: Core dbt manifest tests map generic tests into DataForge constraints; external adapter dispatch remains experimental.
  - claim: mcp_integration
    status: beta
    evidence: MCP stdio tests expose dry-run repair receipts and keep apply behind explicit tool enablement.
  - claim: smt_verified_supported_constraints
    status: beta
    evidence: Unit tests cover type, domain, functional dependency, not-null, unique, accepted-values, and regex verifier outcomes.
  - claim: constitutional_safety_layer
    status: beta
    evidence: Safety tests enforce PII, row-delete, primary-key edit, aggregate-sensitive, high-volume, prompt-injection text, LLM-originated, and conflicting-write policy gates.
  - claim: reversible_transactions
    status: beta
    evidence: Transaction tests assert source snapshots, stale-source refusal, atomic apply, audit, and byte-identical revert.
  - claim: credentialed_cloud_warehouse_apply
    status: roadmap
    evidence: Cloud warehouse mutation remains a dry-run contract boundary until real credentialed conformance suites pass.
  - claim: production_autonomous_repair
    status: roadmap
    evidence: Mutations require explicit apply approval; background autonomous cloud repair is not claimed.
  - claim: design_partner_validation
    status: roadmap
    evidence: CONTRIBUTORS.md marks the design-partner gate as not met.
