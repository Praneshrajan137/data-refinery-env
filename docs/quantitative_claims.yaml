  - id: model_acquiescence_corrector_generated
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /llm_acquiescence_probe/by_class/corrector_generated/rate
    format: "{:.4f}"
    expect: "0.5000"
    note: >-
      Real corrector errors are ratified 7.5x more readily than column-resampled plants (n=8, so
      the magnitude is unestablished; upper bound 0.843). Evidence that the two control classes
      cannot be pooled -- a plant-only beta understates the false-accept rate.

