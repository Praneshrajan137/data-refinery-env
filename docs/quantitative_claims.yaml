# Quantitative claims bound to the artifacts that justify them.
#
# WHY THIS FILE EXISTS
# The API phase published five false or mis-scoped numbers in prose docs. Each was caught
# only by deliberate re-investigation, never by CI, because the existing truth checkers
# verify different things: `readme_truth.py` polices whether a *kind* of claim may appear,
# `benchmark_truth.py` regenerates marker-delimited blocks, and `openapi_contract.py`
# diffs snapshots. None of them verifies a hand-written number in prose against the
# artifact it came from. That is the gap this file and `scripts/ci/docs_truth.py` close.
#
# HOW IT WORKS
# Each entry names a document, an artifact, a JSON pointer into that artifact, and the
# exact string the resolved value must render as. The checker fails when the artifact and
# the prose disagree -- in either direction. There is no float tolerance by design: the
# expected string is compared as it is written, which is how the rest of this repo handles
# numbers in markdown (`dataforge/bench/report.py` freezes floats to fixed precision at
# generation time). If a number legitimately changes, the artifact changes, the checker
# fails, and the prose must be updated deliberately.
#
# SCOPE
# This is not "every number in the docs" -- it is the load-bearing ones, where being wrong
# changes a decision. Adding a claim here is cheap; leaving a decision-relevant number
# unbound is what proved expensive.

claims:
  # --- The central discrimination finding (arm sweep) ---
  - id: freetext_auc
    doc: eval/preregistration/api_phase_certification.md
    artifact: eval/results/corrector_arm_sweep.json
    pointer: /arms/A_freetext_k3/roc_auc
    format: "{:.3f}"
    expect: "0.554"
    note: >-
      Free-text self-consistency confidence is at chance. This is the mechanical reason
      every prior certification attempt returned 0.0 coverage.

  - id: structured_k9_auc
    doc: eval/preregistration/api_phase_certification.md
    artifact: eval/results/corrector_arm_sweep.json
    pointer: /arms/B_structured_k9/roc_auc
    format: "{:.3f}"
    expect: "0.948"
    note: The structured enum creates real ordering where free text has none.

  - id: structured_k3_auc
    doc: eval/preregistration/api_phase_certification.md
    artifact: eval/results/corrector_arm_sweep.json
    pointer: /arms/B_structured_k3/roc_auc
    format: "{:.3f}"
    expect: "0.862"

  # --- Detector queue composition: the regime distinction ---
  - id: hospital_default_precision
    doc: DECISIONS.md
    artifact: eval/results/detector_queue_composition.json
    pointer: /datasets/hospital/regimes/default/precision
    format: "{:.4f}"
    expect: "0.5610"
    note: >-
      The shipped default detector path. Contradicts the retracted "~95% of flagged cells
      are not real errors" framing, which held only under inferred FD constraints.

  - id: hospital_inferred_precision
    doc: DECISIONS.md
    artifact: eval/results/detector_queue_composition.json
    pointer: /datasets/hospital/regimes/inferred_constraints/precision
    format: "{:.4f}"
    expect: "0.0439"
    note: The flooded queue that justified paid triage. Hospital-only, configuration-caused.

  - id: flights_default_precision
    doc: DECISIONS.md
    artifact: eval/results/detector_queue_composition.json
    pointer: /datasets/flights/regimes/default/precision
    format: "{:.4f}"
    expect: "0.9467"
    note: Already high-precision, so there is nothing for a triager to reorder.

  - id: rayyan_default_precision
    doc: DECISIONS.md
    artifact: eval/results/detector_queue_composition.json
    pointer: /datasets/rayyan/regimes/default/precision
    format: "{:.4f}"
    expect: "0.3420"

  # --- The transfer finding: what the paid ranker actually buys ---
  - id: free_ranker_transfer_hospital
    doc: DECISIONS.md
    artifact: eval/results/free_vs_llm_ranker.json
    pointer: /regimes/default/leave_one_dataset_out/hospital/free_transfer_roc_auc
    format: "{:.4f}"
    expect: "0.9316"
    note: Free features transfer acceptably here, which is why hospital alone looked decisive.

  - id: free_ranker_transfer_rayyan
    doc: DECISIONS.md
    artifact: eval/results/free_vs_llm_ranker.json
    pointer: /regimes/default/leave_one_dataset_out/rayyan/free_transfer_roc_auc
    format: "{:.4f}"
    expect: "0.2722"
    note: >-
      Anti-correlated. This single number is why the free ranker must never be a silent
      default, and why the paid ranker's value is transfer rather than information.

  - id: free_ranker_in_sample_rayyan
    doc: DECISIONS.md
    artifact: eval/results/free_vs_llm_ranker.json
    pointer: /regimes/default/leave_one_dataset_out/rayyan/free_in_sample_roc_auc
    format: "{:.4f}"
    expect: "0.9999"
    note: >-
      Near-perfect given labels. Quoting this without the transfer number beside it would
      be the exact error this phase kept making.

  # --- The disconfirming dataset that a published claim ignored ---
  - id: flights_llm_ranker_at_chance
    doc: DECISIONS.md
    artifact: eval/results/review_gate_probe.json
    pointer: /findings/flights/measured_outcome/llm_roc_auc
    format: "{:.3f}"
    expect: "0.514"
    note: >-
      The LLM ranker is at chance on flights. This was committed before the redundancy
      claim was published, and refuted it; the claim generalised from hospital anyway.

  # --- Paired cross-dataset run on gpt-5-mini (NOT comparable to gpt-5.6-sol figures) ---
  - id: xds_hospital_bare_auc
    doc: DECISIONS.md
    artifact: eval/results/ranker_arms_cross_dataset.json
    pointer: /datasets/hospital/arms/0/roc_auc
    format: "{:.4f}"
    expect: "0.8717"

  - id: xds_rayyan_bare_auc
    doc: DECISIONS.md
    artifact: eval/results/ranker_arms_cross_dataset.json
    pointer: /datasets/rayyan/arms/0/roc_auc
    format: "{:.4f}"
    expect: "0.6562"
    note: >-
      rayyan scored 0.955 on gpt-5.6-sol and 0.656 here, so triage quality depends on the
      model as well as the dataset -- neither knowable at runtime without labels.

  - id: xds_rayyan_evidence_auc
    doc: DECISIONS.md
    artifact: eval/results/ranker_arms_cross_dataset.json
    pointer: /datasets/rayyan/arms/1/roc_auc
    format: "{:.4f}"
    expect: "0.2557"
    note: >-
      Below chance. Supplying detector evidence to the ranker is MEASURED HARMFUL: the model
      anchors on a 33.7%-precise detector and inherits its false positives. This refuted the
      "information defect" hypothesis that motivated the parameter.

  - id: xds_flights_bare_auc
    doc: DECISIONS.md
    artifact: eval/results/ranker_arms_cross_dataset.json
    pointer: /datasets/flights/arms/0/roc_auc
    format: "{:.4f}"
    expect: "0.5740"
    note: >-
      Only 17 negatives in 300 cells at a 0.943 base rate, so the CI spans chance and no AUC
      claim belongs here. The base rate already answers the product question.

  # --- Regenerated local certification: the candidate-pruning fix on real data (2026-08-21) ---
  - id: local_type_mismatch_precision
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /pruning_effect_by_class/type_mismatch/precision
    format: "{:.4f}"
    expect: "1.0000"
    note: >-
      92/92 on the regenerated, COMMITTED session. The previous session was never committed, so
      its figures were unverifiable; these are re-derivable from
      eval/results/hospital_calibration_session.json.

  - id: local_entity_consensus_precision
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /pruning_effect_by_class/entity_consensus/precision
    format: "{:.4f}"
    expect: "0.9048"
    note: >-
      Moved again (0.8978 at n=137, 0.9048 at n=84), which is why the earlier alpha=0.05 claim for
      this class was retracted. A proportion at this sample size is not a stable number.

  - id: pruning_certifies_type_mismatch_at_alpha_005
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /pruning_effect_by_class/type_mismatch/by_alpha/0.05/pruned
    format: "{:.2f}"
    expect: "0.60"
    note: >-
      The load-bearing behavioural difference. The unpruned walk certifies NOTHING here because a
      perfect 0/36 at threshold 0.99 fails the Clopper-Pearson floor and halts the fixed sequence.

  - id: model_acquiescence_column_distribution
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /llm_acquiescence_probe/by_class/column_distribution/rate
    format: "{:.4f}"
    expect: "0.0667"
    note: >-
      A MODEL ratifying known-wrong values. NOT human beta, and barred from certificates. Quoted
      only beside the corrector_generated rate, which is 7.5x higher.

  - id: model_acquiescence_corrector_generated
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /llm_acquiescence_probe/by_class/corrector_generated/rate
    format: "{:.4f}"
    expect: "0.5000"
    note: >-
      Real corrector errors are ratified 7.5x more readily than column-resampled plants (n=8, so
      the magnitude is unestablished; upper bound 0.843). Evidence that the two control classes
      cannot be pooled -- a plant-only beta understates the false-accept rate.

  # --- Premise quality: the miner's own precision, measured 2026-08-25 ---
  # These are load-bearing because they are the basis on which a perfectly separating
  # threshold was DECLINED. If the miner's precision or the corpus candidate counts change,
  # the argument in docs/trust/premise-quality-result.md has to be re-made, not just edited.
  - id: premise_hospital_fd_set_precision
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_hospital.json
    pointer: /arms/incumbent/fd_set_precision
    format: "{:.4f}"
    expect: "0.8655"
    note: >-
      FD-set precision of everything the miner emits on hospital. The denominator the
      86 measured clean-cell corruptions must be read against.

  - id: premise_hospital_candidates
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_hospital.json
    pointer: /arms/candidate_total
    format: "{:d}"
    expect: "119"
    note: >-
      Candidate count BEFORE the constant-dependent exclusion shipped. 34 of these had a
      single-valued dependent, which is why the post-change count is 85.

  - id: premise_hospital_false_dependencies
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_hospital.json
    pointer: /arms/incumbent/admitted_false
    format: "{:d}"
    expect: "16"
    note: >-
      Mined dependencies that do NOT hold on ground truth. ZipCode -> HospitalName is one
      of these and accounted for 23 of the 25 sampled corruptions.

  - id: premise_tax_fd_set_precision
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_tax.json
    pointer: /arms/incumbent/fd_set_precision
    format: "{:.4f}"
    expect: "1.0000"
    note: >-
      The vindication. constraint-circularity.md recorded 696-708 false-positive corrections
      on tax before the determinant guards existed; the miner now emits 4 candidates here and
      all 4 are true.

  - id: premise_tax_candidates
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_tax.json
    pointer: /arms/candidate_total
    format: "{:d}"
    expect: "4"
    note: >-
      Four candidates on 200,000 rows. The reason tax cannot validate a threshold fitted to
      hospital: it contains no false dependency to separate.

  - id: premise_flights_candidates
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_flights.json
    pointer: /arms/candidate_total
    format: "{:d}"
    expect: "0"
    note: >-
      The miner emits nothing on flights. Half of why the separating threshold found on
      hospital has nothing to validate it against.

  - id: premise_rayyan_candidates
    doc: docs/trust/premise-quality-result.md
    artifact: eval/results/premise_quality_rayyan.json
    pointer: /arms/candidate_total
    format: "{:d}"
    expect: "0"
    note: >-
      The miner emits nothing on rayyan either. With flights at 0 and tax at 4-of-4 true,
      no corpus can confirm or refute hospital's separation.
  # --- Apply rewrites every line ending (2026-08-26) ---
  # Found by a concurrency test that failed on line endings rather than on the race. Bound here
  # because the numbers argue a REVIEWABILITY cost, not a safety one, and the two revert claims are
  # what keep that distinction honest: if either flipped, this would become a retraction.
  - id: line_ending_lines_reterminated
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /crlf/lines_reterminated
    format: "{:d}"
    expect: "11"
    note: >-
      Every line of an 11-line CRLF file is re-terminated to change one cell. The count is the
      table's ROW COUNT, not a constant, so the collateral scales with the table while the repair
      does not.

  - id: line_ending_cells_changed
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /crlf/cells_changed
    format: "{:d}"
    expect: "1"
    note: >-
      The denominator of the 11-to-1 ratio. Exactly one cell was repaired, which is why the fixture
      was chosen: its repair is provable from a declared functional dependency.

  - id: line_ending_bytes_delta
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /crlf/bytes_delta
    format: "{:d}"
    expect: "12"
    note: >-
      11 carriage returns removed plus one byte from bostonn -> boston.

  - id: line_ending_crlf_before
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /crlf/crlf_before
    format: "{:d}"
    expect: "11"
    note: >-
      The before column of the published table.

  - id: line_ending_bytes_before
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /crlf/bytes_before
    format: "{:d}"
    expect: "147"
    note: >-
      File size before apply.

  - id: line_ending_bytes_after
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /crlf/bytes_after
    format: "{:d}"
    expect: "135"
    note: >-
      File size after apply.

  - id: line_ending_lf_control
    doc: docs/trust/apply-rewrites-line-endings.md
    artifact: eval/results/line_ending_rewrite.json
    pointer: /summary/lf_lines_reterminated
    format: "{:d}"
    expect: "0"
    note: >-
      The control arm, and it is what makes the claim precise. An LF source has ZERO lines
      re-terminated, so the defect is dialect CONVERSION and not unconditional rewriting -- a
      different and much larger claim that this number refutes.
  # --- The two withheld repairers (2026-08-26) ---
  # Pre-registered in eval/preregistration/withheld_repairer_coverage.md. The totals in the trust
  # document (10356 writes, 0 repaired) are arithmetic over the per-corpus numbers bound below, so
  # any one of them drifting fails CI and forces the argument to be re-made.
  - id: withheld_format_hospital_writes
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_hospital.json
    pointer: /detectors/format_violation/no_premise/proposals
    format: "{:d}"
    expect: "99"
    note: >-
      format_violation on hospital. Every one of these is a clean cell, via the leading-zero branch
      padding the row index.

  - id: withheld_format_hospital_corrupted
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_hospital.json
    pointer: /detectors/format_violation/no_premise/corrupted_a_clean_cell
    format: "{:d}"
    expect: "99"
    note: >-
      Equal to the write count: nothing it wrote on hospital was a real error.

  - id: withheld_format_rayyan_corrupted
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_rayyan.json
    pointer: /detectors/format_violation/no_premise/corrupted_a_clean_cell
    format: "{:d}"
    expect: "109"
    note: >-
      rayyan is the only corpus whose errors are natural rather than injected, and the repairer is
      0-for-109 on it.

  - id: withheld_format_tax_flagged
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/format_violation/no_premise/distinct_cells_flagged
    format: "{:d}"
    expect: "20018"
    note: >-
      The flag count behind the 211-minute extrapolation, on the synthetic diagnostic-tier corpus
      measured unsampled at 200,000 rows.

  - id: withheld_format_tax_abstained
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/format_violation/no_premise/abstained_on_flag
    format: "{:d}"
    expect: "9870"
    note: >-
      The abstention machinery works -- it declines half the queue. It simply does not abstain on
      the branch that is wrong.

  - id: withheld_format_tax_corrupted
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/format_violation/no_premise/corrupted_a_clean_cell
    format: "{:d}"
    expect: "10148"
    note: >-
      The number that decided it, and it exists only because tax was measured unsampled. Without
      this arm the finding would have read 208 rather than 10356, a 50-fold understatement.

  - id: withheld_format_tax_repaired
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/format_violation/no_premise/repaired_a_real_error
    format: "{:d}"
    expect: "0"
    note: >-
      Zero real errors repaired on the largest corpus. K1 fires.

  - id: withheld_categorical_rayyan_corrupted
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_rayyan.json
    pointer: /detectors/categorical_normalization/no_premise/corrupted_a_clean_cell
    format: "{:d}"
    expect: "25"
    note: >-
      0-for-25 on rayyan. The companion figure to tax's 0.6189, and the reason neither may be
      quoted alone.

  - id: withheld_categorical_tax_precision
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/categorical_normalization/no_premise/write_precision
    format: "{:.4f}"
    expect: "0.6189"
    note: >-
      Neither kill criterion fires on this. It is nonetheless not a property of the repairer -- it is
      a property of how corrupted this synthetic diagnostic-tier corpus is, since the reference is a
      majority vote over the column's own values.

  - id: withheld_categorical_tax_repaired
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/categorical_normalization/no_premise/repaired_a_real_error
    format: "{:d}"
    expect: "604"
    note: >-
      Where the majority form happens to be the correct one.

  - id: withheld_categorical_tax_corrupted
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/categorical_normalization/no_premise/corrupted_a_clean_cell
    format: "{:d}"
    expect: "295"
    note: >-
      Where the majority form is the corrupted one, so the vote writes corruption into cells that
      were still correct. The mechanism cannot distinguish the two regimes.

  - id: withheld_categorical_tax_wrong
    doc: docs/trust/withheld-repairer-result.md
    artifact: eval/results/withheld_repairers_tax.json
    pointer: /detectors/categorical_normalization/no_premise/wrong_value_on_a_real_error
    format: "{:d}"
    expect: "77"
    note: >-
      Where the majority is a third, also-wrong form.