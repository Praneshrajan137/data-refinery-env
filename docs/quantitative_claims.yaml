    expect: "1.0000"
    note: >-
      92/92 on the regenerated, COMMITTED session. The previous session was never committed, so
      its figures were unverifiable; these are re-derivable from
      eval/results/hospital_calibration_session.json.

  - id: local_entity_consensus_precision
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /pruning_effect_by_class/entity_consensus/precision
    format: "{:.4f}"
    expect: "0.9048"
    note: >-
      Moved again (0.8978 at n=137, 0.9048 at n=84), which is why the earlier alpha=0.05 claim for
      this class was retracted. A proportion at this sample size is not a stable number.

  - id: pruning_certifies_type_mismatch_at_alpha_005
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /pruning_effect_by_class/type_mismatch/by_alpha/0.05/pruned
    format: "{:.2f}"
    expect: "0.60"
    note: >-
      The load-bearing behavioural difference. The unpruned walk certifies NOTHING here because a
      perfect 0/36 at threshold 0.99 fails the Clopper-Pearson floor and halts the fixed sequence.

  - id: model_acquiescence_column_distribution
    doc: docs/trust/local-certification-result.md
    artifact: eval/results/label_noise_instrument.json
    pointer: /llm_acquiescence_probe/by_class/column_distribution/rate
